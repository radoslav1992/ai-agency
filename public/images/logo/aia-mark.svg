<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" fill="none" role="img" aria-hidden="true">
  <!--
    Знакът на AIA в духа на шаблона: кръгъл контур с градиента на бутоните
    и вписан ъгъл — буквата „А“, сведена до два щриха и напречна черта.
  -->
  <defs>
    <linearGradient id="aia-stroke" x1="0" y1="40" x2="40" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2BC0E4" />
      <stop offset="1" stop-color="#EAECC6" />
    </linearGradient>
  </defs>
  <circle cx="20" cy="20" r="18.6" stroke="url(#aia-stroke)" stroke-width="1.6" />
  <path d="M12.4 27.6 20 12.4l7.6 15.2" stroke="url(#aia-stroke)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M15.9 22.4h8.2" stroke="url(#aia-stroke)" stroke-width="1.9" stroke-linecap="round" />
</svg>
